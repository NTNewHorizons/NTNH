# Configuration file

compat {
    # Rules for F3 lines that other mods add without Angelica's F3 API, one rule per entry.
    # A rule matches lines that start with the quoted text (color codes ignored), in the left or right column.
    #   drop left "Text: "                   hides the line
    #   fact left "Text: " group=<panel id>  moves the line into that F3 panel; add name="Label" to rename it
    # Panel ids are listed under Panels in the F3+F6 screen; entry ids show when you hover an entry there.
    # Add when=<entry id> to apply a rule only while that F3 entry is enabled. [default: ]
    S:debugLineRules <
     >

    # Apply fixes to Extra Utilities [default: true]
    B:fixExtraUtils=false

    # Apply fixes to Immersive Engineering [default: true]
    B:fixImmersiveEngineering=false

    # Redirect KaizPatchX script GL calls through Angelica's GLRedirects API [default: true]
    B:fixKaizPatchX=true

    # Apply fixes to the LOTR mod [default: true]
    B:fixLotr=false

    # Apply fixes to Minefactory Reloaded [default: true]
    B:fixMinefactoryReloaded=false

    # Apply fixes to NTM:Space [default: true]
    B:fixNTMSpace=true

    # Apply fixes to Security Craft [default: true]
    B:fixSecurityCraft=true

    # Apply fixes to Stacks on Stacks [default: true]
    B:fixStacksOnStacks=true

    # Apply fixes to Thaumcraft [default: true]
    B:fixThaumcraft=false

    # Apply fixes to ThaumicHorizons [default: true]
    B:fixThaumicHorizons=false
}


