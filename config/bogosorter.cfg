# Configuration file

general {
    # The damage threshold for auto-refill. If the item has less than this amount of durability, it will be refilled. [range: -2147483648 ~ 2147483647, default: 1]
    I:autoRefillDamageThreshold=1

    # Allow auto-refill to take items from pinned player inventory slots. (Client Side Toggle) [default: false]
    B:autoRefillFromPinnedSlots=false

    # Allow auto-refill to take items from pinned player inventory slots. (Server Side Toggle) [default: true]
    B:autoRefillFromPinnedSlots_server=true

    # The color of the sort button.
    # Display format: 0xAARRGGBB (e.g. 0xFFFFFFFF for white, 0xFF0000FF for red).
    # Value is displayed in decimal here but interpreted as hex internally. [range: -2147483648 ~ 2147483647, default: -1]
    S:buttonColor=-1

    # Enable the sort button in the player inventory. [default: true]
    B:buttonEnabled=true

    # Enable the auto-refill feature (Client Side Toggle). [default: true]
    B:enableAutoRefill=true

    # Enable the auto-refill feature. (Server Side Toggle) [default: true]
    B:enableAutoRefill_server=true

    # Enable the debug clear/randomize inventory tools (numpad 1/2 in a container GUI).
    # These overwrite inventory contents, so they are restricted to server operators even when enabled. [default: false]
    B:enableDebugTools=false

    # Allow player hotbar to be sorted. [default: false]
    B:enableHotbarSort=true

    # Enable the hotbar swap feature. [default: true]
    B:enableHotbarSwap=true

    # Offset of the pinned slot icon from the item's top-left corner.
    # Possible values: [PX_0, PX_1, PX_2]
    #  [default: PX_1]
    S:pinnedSlotIconOffset=PX_1

    # Texture set used to mark pinned inventory slots.
    # Possible values: [STAR_0, STAR_1, STAR_2, DOT_0, DOT_1, DOT_2, LOCK_0, LOCK_1, LOCK_2]
    #  [default: STAR_1]
    S:pinnedSlotStyle=STAR_1

    # If enabled, items with max stack size of 1 (e.g., tools, armor, etc.)
    # will not be split when sorting. This helps avoid cluttering the inventory with duplicate single-item stacks. [default: true]
    B:preventSplit=true

    # Render the icon over pinned inventory slots. The outline is always shown. [default: true]
    B:showPinnedSlotIcon=true

    # Sound played when the sort button is pressed. [default: gui.button.press]
    S:sortSound=gui.button.press

    ##########################################################################################################
    # dropoff
    #--------------------------------------------------------------------------------------------------------#
    # DropOff Configuration
    ##########################################################################################################

    dropoff {
        # Wallet used when dropping coins into a nearby Vending Machine.
        # Possible values: [PERSONAL, TEAM]
        #  [default: PERSONAL]
        S:coinDepositDestination=PERSONAL

        # Show a chat message after dropping off items. [default: true]
        B:dropoffChatMessage=true

        # Throttle drop-off packets in milliseconds. [range: -2147483648 ~ 2147483647, default: 500]
        I:dropoffPacketThrottleInMS=500

        # Time quota for drop-off in milliseconds. [range: -2147483648 ~ 2147483647, default: 1]
        I:dropoffQuotaInMS=1

        # The radius (in blocks) around the player to scan for drop-off targets. [range: -2147483648 ~ 2147483647, default: 4]
        I:dropoffRadius=4

        # Render a highlight on eligible drop-off containers. [default: true]
        B:dropoffRender=true

        # Enable fading out animation for the highlight. [default: true]
        B:dropoffRenderFadeOut=true

        # The style of the render highlight (CUBE or BRACE).
        # Possible values: [CUBE, BRACE, FILLED, SMALL_CUBE, FILLED_CORE]
        #  [default: CUBE]
        S:dropoffRenderStyle=CUBE

        # Valid inventory names for drop-off targeting (substring match). [default: [Chest], [Barrel], [Drawer], [Crate], [Present], [Cabinet], [Counter], [Fridge], [Filing], [Compartment], [Shulker]]
        S:dropoffTargetNames <
            Chest
            Barrel
            Drawer
            Crate
         >

        # Enable the drop-off button in the player inventory. [default: true]
        B:enableDropOff=true

        # Enable drop-off from the hotbar. [default: false]
        B:enableHotbarDropOff=false

        ##########################################################################################################
        # button
        #--------------------------------------------------------------------------------------------------------#
        # DropOff Button Configuration
        ##########################################################################################################

        button {
            # X position of the drop-off button in the player inventory. [range: -2147483648 ~ 2147483647, default: 160]
            I:buttonX=160

            # Y position of the drop-off button in the player inventory. [range: -2147483648 ~ 2147483647, default: 5]
            I:buttonY=5

            # Show the drop-off button in the player inventory. [default: true]
            B:showButton=true
        }

    }

    ##########################################################################################################
    # usageticker
    #--------------------------------------------------------------------------------------------------------#
    # Usage Ticker Configuration
    ##########################################################################################################

    usageticker {
        # Show usage ticker for armor. [default: true]
        B:enableArmor=true

        # Show usage ticker for main hand. [default: true]
        B:enableMainHand=true

        # Enable usage ticker module. [default: true]
        B:enableModule=true

        # Show usage ticker for off hand. [default: true]
        B:enableOffHand=true

        ##########################################################################################################
        # arrow
        #--------------------------------------------------------------------------------------------------------#
        # Arrow Configuration
        ##########################################################################################################

        arrow {
            # List of item IDs to consider as valid arrows for the usage ticker. The order matters; the first match is used. [default: [Thaumcraft:PrimalArrow], [etfuturum:tipped_arrow]]
            S:arrowItems <
                Thaumcraft:PrimalArrow
                etfuturum:tipped_arrow
             >

            # List of bow item IDs to enable arrow ticker for. Add modded bows here. [default: [minecraft:bow], [Botania:crystalBow], [Botania:livingwoodBow], [DraconicEvolution:draconicBow], [DraconicEvolution:wyvernBow], [BloodArsenal:bound_bow], [EnderZoo:guardiansBow], [GalaxySpace:item.QuantBow], [Natura:natura.bow.ghostwood], [Natura:natura.bow.bloodwood], [Natura:natura.bow.darkwood], [Natura:natura.bow.fusewood], [battlegear2:bow.iron], [battlegear2:bow.diamond], [Thaumcraft:ItemBowBone], [TwilightForest:item.tripleBow], [TwilightForest:item.seekerBow], [TwilightForest:item.iceBow], [TwilightForest:item.enderBow]]
            S:bowItems <
                minecraft:bow
                Botania:crystalBow
                Botania:livingwoodBow
                DraconicEvolution:draconicBow
                DraconicEvolution:wyvernBow
                BloodArsenal:bound_bow
                EnderZoo:guardiansBow
                GalaxySpace:item.QuantBow
                Natura:natura.bow.ghostwood
                Natura:natura.bow.bloodwood
                Natura:natura.bow.darkwood
                Natura:natura.bow.fusewood
                battlegear2:bow.iron
                battlegear2:bow.diamond
                Thaumcraft:ItemBowBone
                TwilightForest:item.tripleBow
                TwilightForest:item.seekerBow
                TwilightForest:item.iceBow
                TwilightForest:item.enderBow
             >

            # Show usage ticker for arrow. [default: true]
            B:enableArrow=true
        }

    }

    ##########################################################################################################
    # ae2integration
    #--------------------------------------------------------------------------------------------------------#
    # AE2 and Thaumic tooltip/search integration.
    ##########################################################################################################

    ae2integration {
        # Enable AE2 item/fluid amount lines in NEI and inventory tooltips. [default: true]
        B:enableAmountTooltips=true

        # Log optional AE2/NEI/Thaumic integration diagnostics. [default: false]
        B:enableIntegrationDebugLogging=false

        # Enable searching an AE2 terminal from the configured hover-search key. [default: true]
        B:enableTerminalHoverSearch=true

        # Enable Thaumic Energistics essentia amount lookups in AE2 amount tooltips. [default: true]
        B:enableThaumicEssentia=true
    }

    ##########################################################################################################
    # dropkeyrepeat
    #--------------------------------------------------------------------------------------------------------#
    # Drop Key Repeat Configuration
    ##########################################################################################################

    dropkeyrepeat {
        # Hold the vanilla drop key to keep dropping items (world and container GUIs). [default: true]
        B:enableDropKeyRepeat=true

        # Ticks the drop key must stay held before the first repeat. [range: 0 ~ 100, default: 5]
        I:initialDelayTicks=5

        # Ticks between repeated drops while the key is held. [range: 1 ~ 100, default: 1]
        I:repeatIntervalTicks=1
    }

}


