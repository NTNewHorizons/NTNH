# Configuration file

general {
    I:bannerMaxHeight=256
    I:bannerMaxWidth=1280

    # Custom mod info entries. 
    # Format: modid:field1=value,field2=value2 
    # Available fields: name, description, url, issueTrackerUrl, logoFile, iconFile, iconItem, backgroundFile, license, credits
    S:customModInfo <
     >

    # Whether enable Catalogue.
    # Setting it false will stop Catalogue redirecting Forge's mod list calls.
    B:enable=true
    B:enableBannerLimit=false
    B:enableIconLimit=false

    # The list of mod ids that should always use the default item icon.
    # They will not have random-picked item icons to avoid crashes.
    S:forceDefaultIconList <
     >
    I:iconMaxWidthHeight=256

    # The list of ignored dependencies' mod ids.
    # They will not be displayed when searching for dependencies/dependants.
    S:ignoredDependenciesList <
        minecraft
        Forge
        FML
        mcp
     >

    # The list of library mods' mod ids.
    # They will have grey names in the mod list.
    S:libraryList <
        Forge
        FML
        mcp
        gtnhlib
        hodgepodge
        unimixins
        lwjgl3ify
     >
}


