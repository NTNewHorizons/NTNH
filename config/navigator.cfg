# Configuration file

general {
    # Enable debug layers [default: false]
    B:enableDebugLayers=false

    # Keep the fullscreen map search text when reopening the map [default: true]
    B:rememberSearchText=true
}


modules {
    # Enable JourneyMap module [default: true]
    B:enableJourneyMapModule=true

    # Enable Xaero's Minimap module [default: true]
    B:enableXaeroMinimapModule=true

    # Enable Xaero's World Map module [default: true]
    B:enableXaeroWorldMapModule=true
}


