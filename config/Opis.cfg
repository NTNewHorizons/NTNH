# Configuration file

access_rights {
    # Minimum access level to be open Opis interface. Valid values : NONE, PRIVILEGED, ADMIN
    S:opis=PRIVILEGED

    # List of players with PRIVILEGED access level.
    S:privileged <
     >

    # Minimum access level to be able to view tables in /opis command. Valid values : NONE, PRIVILEGED, ADMIN
    S:tables=PRIVILEGED
}


general {
    B:display.microseconds=true
    I:laggenerator_id=-1

    # Opacity of the map overlay chunk fill. 0 is invisible, 255 is opaque.
    I:overlay.alpha.loaded=80

    # Opacity of the map overlay chunk fill. 0 is invisible, 255 is opaque.
    I:overlay.alpha.timing=200

    # How often the map overlays ask the server for fresh data, in milliseconds. Raise it to cut bandwidth; the loaded chunk overlay sends 13 bytes per loaded chunk each time.
    I:overlay.refresh_ms=1000
    I:profiler.delay=1
    I:profiler.maxpts=250
}


remote_console {
    B:opisrcon.active=false
    S:opisrcon.password=
    I:opisrcon.port=25566
}


