# Configuration file

emoji {
    # Check for emoji data updates on startup (uses If-Modified-Since) [default: true]
    B:checkForEmojiUpdates=true

    # Close the picker after selecting an emoji [default: true]
    B:closePickerOnSelect=true

    # Enable debug logging [default: false]
    B:debugMode=false

    # Enable loading Twitter emojis (Twemoji) [default: true]
    B:enableTwemoji=true

    # Ordered list of enabled font source IDs, first = highest priority. IDs: 'minecraft', 'twemoji', or a font filename. [default: [twemoji], [minecraft]]
    S:fontStack <
        twemoji
        minecraft
     >

    # Display height in pixels for stack-rendered text glyphs from non-Minecraft fonts [range: 8 ~ 16, default: 10]
    I:fontStackTextDisplayHeight=10

    # Per-font display/variation overrides in the form 'fontId|size=10;axis=value' [default: ]
    S:fontVariationSettings <
     >

    # Max concurrent emoji image downloads [range: 1 ~ 16, default: 4]
    I:maxDownloadThreads=4

    # Emoji shown on the picker button (without colons) [default: grinning]
    S:pickerButtonEmoji=grinning

    # Render custom emotes sent by other players [default: true]
    B:receiveClientEmotes=true
}


server {
    # Allow clients to send custom emotes to other players [default: true]
    B:allowClientEmotes=true

    # Max size in bytes for a client emote image [range: 1024 ~ 9999999, default: 524288]
    I:maxClientEmoteSize=524288

    # Persistent custom emoji quota per player in bytes (0 disables the byte limit) [range: 0 ~ 67108864, default: 2097152]
    I:maxStoredClientEmojiBytesPerUser=2097152

    # Persistent custom emoji quota per player by emoji count (0 disables the count limit) [range: 0 ~ 100000, default: 0]
    I:maxStoredClientEmojiCountPerUser=0
}


