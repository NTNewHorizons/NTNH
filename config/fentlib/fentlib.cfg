# Configuration file

debug {
    # Enable debug mode. [default: false]
    B:debugMode=false

    # If set to true, log every GUI opened through Minecraft.displayGuiScreen. [default: false]
    B:logOpenedGuis=false

    # If set to true, print a list of biome names on game post init.
    B:printBiomes=false

    # If set to true, print a list of dimension names on game post init.
    B:printDimensions=false

    # If set to true, print a list of mob names on game post init.
    B:printMobs=false

    # If set to true, print a list of potions in the logs on game post init.
    B:printPotions=false
}


general {
    # Enable fishing loot table override. [default: false]
    B:enableFishingLootTable=false

    # Gif size cap in megabytes after being stitched into a png spritesheet. [range: 1 ~ 10, default: 2]
    I:gifSizeCap=2

    # Maximum frames a gif is allowed to have. [range: 1 ~ 9999, default: 1000]
    I:maxGifFrameCount=1000

    # List of passive mobs that should be able to inflict damage.
    S:passiveMobsWhichCanInflictDamage <
     >

    # Public base URL of this server (e.g. myserver.example.com:25565 or https://myserver.example.com). This is the public base only; mods should append their own relative route paths. [default: ]
    S:publicBaseUrl=

    # Directory to search for server icons. Leave empty to use the default server root. Relative paths are resolved from the server root; absolute paths are used directly. [default: ]
    S:serverIconDirectory=

    # Default sodiumgui accent color used when callers do not provide their own. Accepts #RRGGBB, #AARRGGBB, 0xRRGGBB, or 0xAARRGGBB.
    S:sodiumGuiAccentColor=#94E4D3

    # Use the pure Java GIF reader instead of scrimage. Disable this to fall back to the scrimage-based reader. [default: true]
    B:useNativeGifReader=true
}


misc-tweaks {
    # Disable the EnderCore information button in the modlist screen. [default: true]
    B:disableEnderCoreInfoButton=false

    # Apply the vanilla title screen's milky gradient to panorama backgrounds. [default: true]
    B:milkyPanorama=false
}


