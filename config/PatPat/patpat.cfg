# Configuration file

##########################################################################################################
# general
#--------------------------------------------------------------------------------------------------------#
# PatPat configuration
##########################################################################################################

general {

    main {
        # Master on/off switch for PatPat. [default: true]
        B:modEnabled=true

        # Cooldown between pats, in ticks. [range: -2147483648 ~ 2147483647, default: 4]
        I:patCooldownTicks=4

        # Whether the player's main hand must be empty to trigger a pat. [default: true]
        B:requireEmptyMainHand=true

        # Whether the player must be sneaking to trigger a pat. [default: true]
        B:requireSneaking=true
    }

    multiplayer {
        # Allow local pat rendering when only the client has the mod installed. [default: true]
        B:allowClientOnly=true

        # Send pat sync packets to the server when connected. [default: true]
        B:enableServerSync=true
    }

    resourcepacks {
        # Load animation configs from resource packs. [default: true]
        B:enableCustomAnimations=true

        # Enable compatibility mode for upstream (Fabric) resource pack format. [default: true]
        B:enableUpstreamPackCompatibility=true
    }

    sounds {
        # Enable custom sounds during pat animation. [default: true]
        B:enabled=true
    }

    debug {
        # Enable debug logging. [default: false]
        B:enableDebugMode=false
    }

}


