# Configuration file

compatibility {
    # Adds all mob variants EnderIO powered spawners to NEI.
    B:addAllEnderIOSpawnersToNEI=true

    # Enables "Infernal Drops" NEI page if Infernal-Mobs mod is loaded.
    B:enableInfernalDrops=true
}


debug {
    # 0 - Default, log only basic, summary information. 1 - More detailed logs
    I:LoggingLevel=1
    B:ShowRenderErrors=true
}


fishinghandler {
    # Show fishing drops in NEI
    B:Enabled=true
}


mobhandler {
    # When will cache regeneration trigger? 0 - Never, 1 - ModAdditionRemoval, 2 - ModAdditionRemovalChange, 3 - Always, 
    I:CacheRegenerationTrigger=2

    # Enable "Mob Info" NEI page
    B:Enabled=true

    # Hidden mode will make all mobs hidden in NEI until you kill them.
    B:HiddenMode=false

    # Include mobs that have no drops in NEI
    B:IncludeEmptyMobs=false

    # Skip a drop category/Looting variant as soon as its estimated path count exceeds this value. Zero or negative disables this estimate limit. Replaces MaxPathsPerMobPass.
    I:MaxEstimatedPathsPerMobPass=10000000

    # These mobs are skipped during recipe generation and cache loading. The client's blacklist also applies when joining a server. Restart the game after changing it.
    S:MobBlacklist <
        Player
        Giant
        Thaumcraft.TravelingTrunk
        chisel.snowman
        OpenBlocks.Luggage
        OpenBlocks.MiniMe
        SpecialMobs.SpecialCreeper
        SpecialMobs.SpecialZombie
        SpecialMobs.SpecialPigZombie
        SpecialMobs.SpecialSlime
        SpecialMobs.SpecialSkeleton
        SpecialMobs.SpecialEnderman
        SpecialMobs.SpecialCaveSpider
        SpecialMobs.SpecialGhast
        SpecialMobs.SpecialWitch
        SpecialMobs.SpecialSpider
        TwilightForest.HydraHead
        TwilightForest.RovingCube
        TwilightForest.Harbinger Cube
        TwilightForest.Adherent
        SpecialMobs.SpecialSilverfish
     >

    # Seconds to wait before skipping a mob's dropmap. If negative, will not timeout any mobs
    D:MobTimeout=10.0

    # Group equivalent outcomes of direct Random comparisons when generating mob drops.
    B:OptimizeRandomComparisons=true
}


villagertradeshandler {
    # Show villager trades in NEI
    B:Enabled=true

    # Seconds allowed per trade handler and profession. Negative disables the time limit.
    D:HandlerTimeout=10.0

    # Skip a trade handler/profession as soon as its estimated path count exceeds this value. Zero or negative disables this estimate limit. Replaces MaxPathsPerHandler.
    I:MaxEstimatedPathsPerHandler=10000000

    # Group equivalent outcomes of direct Random comparisons when generating villager trades.
    B:OptimizeRandomComparisons=true
}


