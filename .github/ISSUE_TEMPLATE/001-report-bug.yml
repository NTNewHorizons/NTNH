name: Report Bug
description: "Report a bug that does not abruptly end a game session or prevent the start of the game."
labels:
- "Status: Triage"
- "Bug: Minor"
body:
- type: markdown
  attributes:
    value: |
      Examples of this category include: item duping, item voiding, cannot craft item, behavior and description does not match.

      Please note if you merely want a change, e.g. think something is too OP, you should use the Suggest a Change template instead.
- type: textarea
  id: environment
  attributes:
    label: Pack, Server, and Contact Details
    description: |
      Include your pack version and server name (use SP if you are not on a dedicated server). Try updating an old pack first; releases fix hundreds of issues, and Dev releases may not appear on other platforms.
      Optionally include your NTNH Discord username so we can contact you, and your server type: Single Player, Open To LAN, Vanilla Forge, Crucible, Thermos, Ultramine, Other MCPC+ fork, or Don't know. Listed server types are not necessarily supported. Open To LAN means opening a local world through the ESC menu without dedicated server software.
    value: |
      Pack version:
      Server name (or SP):
      Server type (optional):
      NTNH Discord username (optional):
  validations:
    required: true
- type: textarea
  id: expectation
  attributes:
    label: Steps, Expected Result, and Actual Result
    description: What did you try to do, what did you expect, and what happened instead? Attach screenshots if needed.
    value: |
      Steps to reproduce:

      Expected result:

      Actual result:
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: Your Proposal
    description: Please describe it briefly in one or two sentences.
    placeholder: "Example: Consume 1 Bar properly."
  validations:
    required: true
- type: checkboxes
  id: final
  attributes:
    label: Final Checklist
    description: Please mark them so we can better handle this report
    options:
      - label: "I have searched this issue tracker and there is nothing similar already. Posting on a closed issue saying the bug still exists will prompt us to investigate and reopen it once we confirm your report."
        required: true
      - label: "I can reproduce this problem consistently by follow the exact steps I described above, or this does not need reproducing, e.g. recipe loophole."
        required: false
      - label: "I have asked other people and they confirm they also have this problem by follow the exact steps I described above, or this does not need reproducing, e.g. recipe loophole."
        required: false
