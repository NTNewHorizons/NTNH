name: 'Request New Feature'
description: Request a new feature.
labels: 
- "Status: Triage"
- "Suggestion"
body:
- type: markdown
  attributes:
    value: |
      Examples of this category include: add void miners, add a naquadah processing line.

      Please note that if you want to change an existing feature, e.g. think something is too OP, you should use the Suggest a Change template instead.
- type: textarea
  id: environment
  attributes:
    label: Pack Version and Contact Details
    description: Include your pack version and optionally your NTNH Discord username so we can contact you. Check the latest pack first; your feature may already exist. Dev releases may not appear on other platforms.
    value: |
      Pack version:
      NTNH Discord username (optional):
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: Your Proposal
    description: What do you propose? Please describe it briefly in one or two sentence.
    placeholder: "Example: Add a mega PA."
  validations:
    required: true
- type: textarea
  id: goal
  attributes:
    label: Goal and Expected Improvement
    description: Why is this feature needed, and how would it improve the pack? For example, explain why existing PAs are too small and how a mega PA would improve bases and the game experience.
    value: |
      Why this feature is needed:

      How it would improve the pack:
  validations:
    required: true
- type: checkboxes
  id: final
  attributes:
    label: Final Checklist
    description: Please mark them so we know you are serious with your suggestion.
    options:
      - label: "I have searched this issue tracker and there is nothing similar already. Posting on a closed issue saying *I like this feature please reconsider adding it* will prompt us to investigate and reopen it once we confirm your report."
        required: true
      - label: "I believe there is nothing similar in the pack already, or the existing solution isn't good enough."
        required: true
      - label: "I understand this change request may not attract enough attention and thus not be implemented."
        required: true
      - label: "I understand this change request may be rejected due to other community members thinking it's inappropriate."
        required: true
      - label: "I believe this feature would make the pack better."
        required: true
