name: Create a Reminder
description: Create a reminder for developer(s).
labels:
- "Status: Triage"
body:
- type: markdown
  attributes:
    value: |
      Often developers tell you to create a ticket as reminder so they don't keep forgetting things.

      Choose this one ONLY when instructed to do so.
- type: textarea
  id: environment
  attributes:
    label: Pack Version and Contact Details
    description: Include your pack version and optionally your NTNH Discord username so we can contact you for more information.
    value: |
      Pack version:
      NTNH Discord username (optional):
  validations:
    required: true
- type: textarea
  id: request
  attributes:
    label: Original Request and Developer's Promise
    description: What did you request, and what did the developer promise? Rephrase the promise in your own words so we can check that your expectation matches it. For example, you were struggling with power generation and glease promised a new magic-based power option.
    value: |
      Original request:

      Developer's promise (in your own words):
  validations:
    required: true
- type: textarea
  id: dev
  attributes:
    label: Responding Developer and Context
    description: Mention the developer using @ (for example, @Glease) and link the relevant Discord chat messages.
    value: |
      Responding developer:
      Discord message links:
  validations:
    required: true
- type: checkboxes
  id: final
  attributes:
    label: Final Checklist
    description: Please mark them so we know you are aware of some common misconceptions.
    options:
      - label: "The developer in question has instructed me to create such an issue."
        required: true
      - label: "I believe the developer is not causally joking around."
        required: true
      - label: "I understand this reminder might take a long time to implement no matter what the developer has promised. (e.g. unforeseeable life difficulty, computer breakdowns, forgetting, laziness, etc)"
        required: true
      - label: "I understand other people (developers or not) might not like this feature and would oppose its integration."
        required: true
      - label: "I believe this feature would make the pack better."
        required: true
