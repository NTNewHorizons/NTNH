name: Report Crash
description: "Report a bug that abruptly ends a game session or prevents the start of the game."
labels:
- "Crash"
- "Status: Triage"
body:
- type: markdown
  attributes:
    value: |
      Examples of this category include: crashing to desktop, game window disappearing, uncommanded computer shutdown. ~~Please blame your local power grid if your neighbor's computer also shut down due to power outage.~~

      Please note if you merely want a change, e.g. think something is too OP, you should use the Suggest a Change template instead.
- type: textarea
  id: environment
  attributes:
    label: Pack, Server, and Contact Details
    description: |
      Include your pack version and server name (use SP if you are not on a dedicated server). Try updating an old pack first; releases fix hundreds of issues, and Dev releases may not appear on other platforms.
      Optionally include your NTNH Discord username so we can contact you, and your server type: Single Player, Open To LAN, Vanilla Forge, Crucible, Thermos, Ultramine, Other MCPC+ fork, or Don't know. Listed server types are not necessarily supported. Open To LAN means opening a local world through the ESC menu without dedicated server software.
    value: |
      Pack version:
      Server name (or SP):
      Server type (optional):
      NTNH Discord username (optional):
  validations:
    required: true
- type: textarea
  id: reproduce
  attributes:
    label: Your Actions
    description: What did you try to do before the crash? Attach screenshots if needed.
    placeholder: "Example: Trying to craft Foo. Expect to consume 1 Bar and get 1 Foo."
  validations:
    required: true
- type: textarea
  id: report
  attributes:
    label: Crash Report
    description: "If no crash report is created, attach `logs/fml-client-latest.log` or `logs/fml-server-latest.log`, depending on if it's a dedicated server crash or a client crash. You can also type in additional info that you consider important."
    placeholder: "Example: pastebin/something OR submit the file to github by dragging it to this textbox."
  validations:
    required: true
- type: checkboxes
  id: final
  attributes:
    label: Final Checklist
    description: Please mark them so we can better handle this report.
    options:
      - label: "I have searched this issue tracker and there is nothing similar already. Posting on a closed issue saying the crash still exists will prompt us to investigate and reopen it once we confirm your report."
        required: true
      - label: "I can reproduce this crash consistently by following the exact steps I described above."
        required: false
      - label: "I have asked other people and they confirm they also crash by following the exact steps I described above."
        required: false
