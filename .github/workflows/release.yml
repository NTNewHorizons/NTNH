name: Build and Publish Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build the release from (defaults to the branch the workflow is run on)'
        required: false
        type: string
        default: ''
      release_name:
        description: 'Name/tag for the release (leave empty to use the version from pack.toml)'
        required: false
        type: string
        default: ''
      release_type:
        description: 'Release type'
        required: true
        type: choice
        default: release
        options:
          - release
          - prerelease
          - latest
  release:
    types: [published]

concurrency:
  group: stable-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  PACKWIZ_VERSION: ef87d964f8cbd52b3b13ea42453ef322290e2b9e

jobs:
  release:
    name: Build and publish packages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.branch != '') && inputs.branch || github.ref }}
          fetch-depth: 0
          lfs: true

      - name: Pull Git LFS files
        run: |
          git lfs pull
          git lfs fsck

      - name: Read and validate version
        id: version
        run: |
          VERSION=$(awk -F '"' '/^version = / { print $2; exit }' pack.toml)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version in pack.toml: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine release metadata
        id: release_info
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || '' }}
          INPUT_RELEASE_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.release_name || '' }}
          INPUT_RELEASE_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type || '' }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_RELEASE_NAME: ${{ github.event.release.name }}
          EVENT_RELEASE_TARGET: ${{ github.event.release.target_commitish }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # Fallback to the pack.toml version when no custom name is given
            TAG="${INPUT_RELEASE_NAME:-$VERSION}"
            TITLE="${INPUT_RELEASE_NAME:-$VERSION}"
            TARGET="${INPUT_BRANCH:-$REF_NAME}"

            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "Release tag $TAG already exists" >&2
              exit 1
            fi

            case "$INPUT_RELEASE_TYPE" in
              prerelease) EXTRA_FLAG="--prerelease" ;;
              latest) EXTRA_FLAG="--latest" ;;
              *) EXTRA_FLAG="" ;;
            esac
          else
            # Triggered by a manually published GitHub release: attach
            # built assets to the release that already exists.
            TAG="$EVENT_RELEASE_TAG"
            TITLE="$EVENT_RELEASE_NAME"
            TARGET="$EVENT_RELEASE_TARGET"
            EXTRA_FLAG=""
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "extra_flag=$EXTRA_FLAG" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Install Packwiz
        run: go install github.com/packwiz/packwiz@${PACKWIZ_VERSION}

      - name: Build release packages
        run: ./build-packwiz.sh

      - name: Verify package names
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -f "dist/NTNH-$VERSION-CurseForge.zip"
          test -f "dist/NTNH-$VERSION-Modrinth.mrpack"
          test -f "dist/NTNH-$VERSION-Native.zip"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NTNH-${{ steps.version.outputs.version }}
          path: |
            dist/NTNH-${{ steps.version.outputs.version }}-CurseForge.zip
            dist/NTNH-${{ steps.version.outputs.version }}-Modrinth.mrpack
            dist/NTNH-${{ steps.version.outputs.version }}-Native.zip
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.UNIVERSAL_FINE }}
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.release_info.outputs.tag }}
          TITLE: ${{ steps.release_info.outputs.title }}
          TARGET: ${{ steps.release_info.outputs.target }}
          EXTRA_FLAG: ${{ steps.release_info.outputs.extra_flag }}
        run: |
          git config user.name "Bufka2011"
          git config user.email "bufka.bulanov@gmail.com"

          FILES=(
            "dist/NTNH-$VERSION-CurseForge.zip"
            "dist/NTNH-$VERSION-Modrinth.mrpack"
            "dist/NTNH-$VERSION-Native.zip"
          )

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            gh release create "$TAG" \
              "${FILES[@]}" \
              --target "$TARGET" \
              --title "$TITLE" \
              --notes-file CHANGELOG.md \
              $EXTRA_FLAG
          else
            gh release upload "$TAG" "${FILES[@]}" --clobber
          fi
