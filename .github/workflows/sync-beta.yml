name: Sync Beta to Server Repo

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  sync-beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: updates/upcoming
          fetch-depth: 0
          lfs: true

      - name: Sync Beta to NTNH-Server
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          cd /tmp
          git lfs install
          git clone --branch beta "https://x-access-token:${{ secrets.UNIVERSAL_FINE }}@github.com/NTNewHorizons/NTNH-Server.git" server-repo

          cd /tmp/server-repo
          git lfs install
          git rm -r --ignore-unmatch mods config scripts serverutilities falsepattern hbmComputerUpload knownkeys.txt oauthprofiles.json 2>/dev/null || true

          rsync -av --delete \
            --exclude='.git/' \
            --exclude='server/' \
            --exclude='install/' \
            --exclude='README.md' \
            --exclude='Dockerfile' \
            --exclude='eula.txt' \
            --exclude='start.sh' \
            --exclude='start.bat' \
            --exclude='server-args.txt' \
            --exclude='server.jar' \
            --exclude='minecraft_server.1.7.10.jar' \
            --exclude='forge-1.7.10-10.13.4.1614-1.7.10-universal.jar' \
            --exclude='docker/' \
            --exclude='libraries/' \
            --exclude='.github/' \
            --exclude='CHANGELOG.md' \
            --exclude='LICENSE' \
            --exclude='SECURITY.md' \
            --exclude='.gitattributes' \
            --exclude='.gitignore' \
            --exclude='.packwizignore' \
            --exclude='*.pw.toml' \
            --exclude='pack.toml' \
            --exclude='index.toml' \
            --exclude='packwiz-sources.json' \
            --exclude='MOD_UPDATE_CHANGELOG.md' \
            --exclude='build-packwiz.sh' \
            --exclude='dev/' \
            --exclude='knownkeys.txt' \
            --exclude='localconfig.cfg' \
            --exclude='oauthprofiles.json' \
            --exclude='Mary-TTS.zip' \
            --exclude-from="${{ github.workspace }}/server/client-only.txt" \
            "${{ github.workspace }}/" /tmp/server-repo/

          cd /tmp/server-repo
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi

          git commit -m "sync-beta: update from NTNH updates/upcoming (${{ github.sha }})"
          git push origin beta
